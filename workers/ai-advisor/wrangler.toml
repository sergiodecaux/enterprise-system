ai = { binding = "AI" }
vars = { NODE_LABEL = "C", MODEL_PRIMARY = "@cf/google/gemma-4-26b-a4b-it", MODEL_FALLBACK = "@cf/zai-org/glm-4.7-flash", DAILY_CAP = "250", MAX_OUTPUT_TOKENS = "900", DISABLE_THINKING = "1", ALLOWED_TG_IDS = "" }

