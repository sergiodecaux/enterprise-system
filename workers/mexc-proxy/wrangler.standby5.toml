# Elite-only worker — Account F / Money bot 7
# Dedicated proxy for @Enterpriseelite_bot (alts). Not in the meme failover ring.
# Deploy: npx wrangler deploy -c wrangler.standby5.toml

name = "mexc-proxy-f"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "f25b2e3490e4beeadf4461cd78c55ccd"

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
BOT_LANE = "elite"
ELITE_ASSISTANT_ONLY = "0"
FAILOVER_ROLE = "standby"
FAILOVER_DAILY_BUDGET = "80000"
FAILOVER_RING = ""
FAILOVER_PEER_URL = ""
PUBLIC_BASE_URL = "https://mexc-proxy-f.mexc-f.workers.dev"
ELITE_PUBLIC_URL = "https://mexc-proxy-f.mexc-f.workers.dev"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "12683358ba894b06a484964bc4b887db"
