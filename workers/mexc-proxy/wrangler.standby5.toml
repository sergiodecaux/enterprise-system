# STANDBY-5 worker — sixth Cloudflare account (F / Money bot 7)
# Deploy: npx wrangler deploy -c wrangler.standby5.toml

name = "mexc-proxy-f"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "f25b2e3490e4beeadf4461cd78c55ccd"

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
FAILOVER_ROLE = "standby"
FAILOVER_DAILY_BUDGET = "80000"
FAILOVER_RING = "https://mexc-proxy.sergiodecaux.workers.dev,https://mexc-proxy-b.mexc-standby.workers.dev,https://mexc-proxy-c.mexc-c.workers.dev,https://mexc-proxy-d.mexc-d.workers.dev,https://mexc-proxy-e.mexc-e.workers.dev,https://mexc-proxy-f.mexc-f.workers.dev"
FAILOVER_PEER_URL = "https://mexc-proxy.sergiodecaux.workers.dev"
PUBLIC_BASE_URL = "https://mexc-proxy-f.mexc-f.workers.dev"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "12683358ba894b06a484964bc4b887db"
