# STANDBY-2 worker — third Cloudflare account (C)
# Extra 1000 KV writes/day. Fill REPLACE_* then:
#   $env:CLOUDFLARE_API_TOKEN = "<token C>"
#   $env:CLOUDFLARE_ACCOUNT_ID = "<account C>"
#   npx wrangler kv namespace create SUBSCRIBERS
#   # paste id below, then:
#   npx wrangler deploy -c wrangler.standby2.toml
# Secrets (same values as A and B):
#   TELEGRAM_BOT_TOKEN TELEGRAM_SNIPER_BOT_TOKEN ALERT_SECRET FAILOVER_SECRET
# After C is live, append its PUBLIC_BASE_URL to FAILOVER_RING on A, B, and C,
# then redeploy all three.

name = "mexc-proxy-c"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "REPLACE_ACCOUNT_C"

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
FAILOVER_ROLE = "standby"
FAILOVER_DAILY_BUDGET = "80000"
FAILOVER_RING = "https://mexc-proxy.sergiodecaux.workers.dev,https://mexc-proxy-b.mexc-standby.workers.dev,https://mexc-proxy-c.REPLACE_SUBDOMAIN.workers.dev"
FAILOVER_PEER_URL = "https://mexc-proxy.sergiodecaux.workers.dev"
PUBLIC_BASE_URL = "https://mexc-proxy-c.REPLACE_SUBDOMAIN.workers.dev"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "REPLACE_KV_C"
