# STANDBY-2 worker — third Cloudflare account (C)
# Deploy: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID for C, then:
#   npx wrangler deploy -c wrangler.standby2.toml
# Secrets (same as A and B): TELEGRAM_* ALERT_SECRET FAILOVER_SECRET MEXC_*

name = "mexc-proxy-c"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "c256c823b763a79fe2206bd16c69a62b"

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
FAILOVER_ROLE = "standby"
FAILOVER_DAILY_BUDGET = "80000"
FAILOVER_RING = "https://mexc-proxy.sergiodecaux.workers.dev,https://mexc-proxy-b.mexc-standby.workers.dev,https://mexc-proxy-c.mexc-c.workers.dev,https://mexc-proxy-d.mexc-d.workers.dev,https://mexc-proxy-e.mexc-e.workers.dev,https://mexc-proxy-f.mexc-f.workers.dev"
FAILOVER_PEER_URL = "https://mexc-proxy.sergiodecaux.workers.dev"
PUBLIC_BASE_URL = "https://mexc-proxy-c.mexc-c.workers.dev"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "226faf17b60b46989be28f1847026e0d"
