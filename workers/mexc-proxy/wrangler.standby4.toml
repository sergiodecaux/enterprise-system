# STANDBY-4 worker — fifth Cloudflare account (E / Money bot 5)
# Deploy: npx wrangler deploy -c wrangler.standby4.toml

name = "mexc-proxy-e"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "d0557787a0a41883caecac1954983a3e"

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
FAILOVER_ROLE = "standby"
FAILOVER_DAILY_BUDGET = "80000"
FAILOVER_RING = "https://mexc-proxy.sergiodecaux.workers.dev,https://mexc-proxy-b.mexc-standby.workers.dev,https://mexc-proxy-c.mexc-c.workers.dev,https://mexc-proxy-d.mexc-d.workers.dev,https://mexc-proxy-e.mexc-e.workers.dev"
FAILOVER_PEER_URL = "https://mexc-proxy.sergiodecaux.workers.dev"
PUBLIC_BASE_URL = "https://mexc-proxy-e.mexc-e.workers.dev"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "4ca643b0a39d436eab11d96a22d4528d"
