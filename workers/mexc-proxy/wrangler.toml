name = "mexc-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "b64dba72f0f7d3fb29ece70dda27d747"

# PRIMARY worker — Account A
# Fill secrets: TELEGRAM_* ALERT_SECRET FAILOVER_SECRET
# Vars below point peer at STANDBY worker URL after you deploy it.

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
FAILOVER_ROLE = "primary"
FAILOVER_RING = "https://mexc-proxy.sergiodecaux.workers.dev,https://mexc-proxy-b.mexc-standby.workers.dev"
FAILOVER_PEER_URL = "https://mexc-proxy-b.mexc-standby.workers.dev"
PUBLIC_BASE_URL = "https://mexc-proxy.sergiodecaux.workers.dev"
FAILOVER_DAILY_BUDGET = "80000"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "71e923e3dfd14345be664ce6b7351b87"
preview_id = "161ce13638eb4cd296886b26e37a35bb"
