# STANDBY-3 worker — fourth Cloudflare account (D / Money bot 3)
# Deploy: npx wrangler deploy -c wrangler.standby3.toml

name = "mexc-proxy-d"
main = "src/index.ts"
compatibility_date = "2024-01-01"
account_id = "7a55891f90e84f1bcf58b901fe568771"

[triggers]
crons = [
  "*/2 * * * *",
  "1-59/2 * * * *",
  "5 * * * *",
  "5 0 * * *"
]

[vars]
FAILOVER_ROLE = "standby"
FAILOVER_DAILY_BUDGET = "80000"
FAILOVER_RING = "https://mexc-proxy.sergiodecaux.workers.dev,https://mexc-proxy-b.mexc-standby.workers.dev,https://mexc-proxy-c.mexc-c.workers.dev"
FAILOVER_PEER_URL = "https://mexc-proxy.sergiodecaux.workers.dev"
PUBLIC_BASE_URL = "https://mexc-proxy-d.mexc-d.workers.dev"
BOT_LANE = "meme"
ELITE_PUBLIC_URL = "https://mexc-proxy-f.mexc-f.workers.dev"

[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "a0df9419bc284e2fad8f0b332ebf15da"
